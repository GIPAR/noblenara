# Monitorador de Colisão
collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "robot_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/noblenara/cmd_vel/raw"
    cmd_vel_out_topic: "/noblenara/cmd_vel"
    transform_tolerance: 0.5
    source_timeout: 2.0

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/noblenara/scan_filtered"
      enabled: True

    polygons: ["SlowDown", "Stop"]

    SlowDown:
      type: "circle"
      radius: 0.6
      action_type: "slowdown"
      slowdown_ratio: 0.8
      min_points: 4
      visualize: True
      enabled: True

    Stop:
      type: "circle"
      radius: 0.4
      action_type: "stop"
      min_points: 4
      visualize: True
      enabled: True


# Lifecycle
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True
    autostart: True
    node_names:
      - controller_server
      - planner_server
      - bt_navigator
      - behavior_server
      - collision_monitor