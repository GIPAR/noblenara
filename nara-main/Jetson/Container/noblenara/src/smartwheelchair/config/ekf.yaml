ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: robot_footprint
    world_frame: odom

    odom0: /noblenara/odom
    # Ordem da Matriz: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,  # Lê vx e vy
                   false, false, false,
                   false, false, false]

    imu0: /noblenara/imu/data  
    # Ordem da Matriz: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    imu0_config: [false, false, false,
                  false, false, true,    # Lê yaw absoluto
                  false, false, false,
                  false, false, true,    # Lê velocidade angular (vyaw)
                  false, false, false]
    
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true