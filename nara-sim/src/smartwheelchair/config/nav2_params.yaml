# Monitorador de Colisão
collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "robot_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/noblenara/cmd_vel/raw"
    cmd_vel_out_topic: "/noblenara/cmd_vel"
    transform_tolerance: 0.5
    source_timeout: 2.0

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/noblenara/scan_filtered"
      enabled: True

    polygons: ["SlowDown_Polygon", "Stop_Polygon"]

      # "[[-0.2, -0.3], [-0.2, 0.3], [0.85, 0.3], [0.85, -0.3]]" Default FootPrint do robot_footprint
    SlowDown_Polygon:
      type: "polygon"
      points: "[[-0.6, -0.9], [-0.6, 0.9], [1.65, 0.9], [1.65, -0.9]]" # Lateral = 0.6m | Frente = 0.8m | Costas = 0.4m (Sem contar o próprio Robô)
      # polygon_sub_topic: # Ouve o Tópico para definir os Pontos do Polígono
      action_type: "slowdown"
      slowdown_ratio: 0.6
      min_points: 4
      visualize: True
      enabled: True

    Stop_Polygon:
      type: "polygon"
      points: "[[-0.45, -0.55], [-0.45, 0.55], [1.20, 0.55], [1.20, -0.55]]" # Lateral = 0.25m | Frente = 0.35m | Costas = 0.15m (Sem contar o próprio Robô)
      # polygon_sub_topic: # Ouve o Tópico para definir os Pontos do Polígono
      action_type: "stop"
      min_points: 4
      visualize: True
      enabled: True

    # Velocity_Polygon:


# Lifecycle
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True
    autostart: True
    node_names:
      - controller_server
      - planner_server
      - bt_navigator
      - behavior_server
      - collision_monitor
