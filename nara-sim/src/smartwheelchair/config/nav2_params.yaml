# Arquivo para navegação autônoma para a NARA
# Use use_sim_time: false para a cadeira física

# amcl:
#   ros__parameters:
#     use_sim_time: True
#     base_frame_id: base_footprint
#     odom_frame_id: odom
#     global_frame_id: map
#     scan_topic: /scan

# Cérebro
bt_navigator:
  ros__parameters:
    use_sim_time: True



# Criadores dos mapas de custo
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: robot_footprint
      resolution: 0.05
      footprint: "[[-0.2, -0.3], [-0.2, 0.3], [0.85, 0.3], [0.85, -0.3]]"
      footprint_padding: 0.01

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan

        scan:
          topic: /noblenara/scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: LaserScan

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.6

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: odom
      robot_base_frame: robot_footprint
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[-0.2, -0.3], [-0.2, 0.3], [0.85, 0.3], [0.85, -0.3]]"
      footprint_padding: 0.01

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan

        scan:
          topic: /noblenara/scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: LaserScan

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5


# Planejador global, retorna um caminho de acordo com o global_costmap
planner_server:
  ros__parameters:
    use_sim_time: True

    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner" # Verficiar opções superiores


# Planejador local
controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]
    goal_checker_plugins: ["goal_checker"]
    progress_checker_plugins: ["progress_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5       # quando estiver x metros do objetivo o marca como completado
      yaw_goal_tolerance: 0.4
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      model_dt: 0.05
      batch_size: 800
      vx_max: 0.5
      vx_min: 0.0
      wz_max: 1.0
      motion_model: "DiffDrive"

      critics: ["ObstaclesCritic", "PathAlignCritic", "PathFollowCritic", "GoalCritic", "GoalAngleCritic", "PreferForwardCritic"]

      ObstaclesCritic:
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 10000.0

      PathAlignCritic:
        cost_weight: 14.0

      PathFollowCritic:
        cost_weight: 5.0

      GoalCritic:
        cost_weight: 5.0
        threshold_to_consider: 1.0

      GoalAngleCritic:
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PreferForwardCritic:
        cost_weight: 2.0


# Comportamentos em Caso de Emergência (Robô Impossibilitado de Continuar)
behavior_server:
  ros__parameters:
    use_sim_time: True
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"



# Configurar corretamente
collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "robot_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/noblenara/cmd_vel_smoothed"
    cmd_vel_out_topic: "/noblenara/cmd_vel"
    transform_tolerance: 0.5
    source_timeout: 2.0

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/noblenara/scan_filtered"
      enabled: True

    polygons: ["SlowDown", "Stop"]

    SlowDown:
      type: "circle"
      radius: 1.0
      action_type: "slowdown"
      slowdown_ratio: 0.5
      min_points: 4
      visualize: True
      enabled: True

    Stop:
      type: "circle"
      radius: 0.4
      action_type: "stop"
      min_points: 4
      visualize: True
      enabled: True


# Lifecycle
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True
    autostart: True
    node_names:
      - controller_server
      - planner_server
      - bt_navigator
      - behavior_server
      - collision_monitor